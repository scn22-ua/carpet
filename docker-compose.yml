services:

  # ═══════════════════════════════════════════════════════════════
  #  WS-01  (Monitor: 9101 | Web: 3001)
  # ═══════════════════════════════════════════════════════════════
  wm_ws_m_01:
    build: { context: ., dockerfile: Dockerfile.app }
    image: wm_app:latest
    container_name: wm_ws_m_01
    command: python -u WM_WS_M.py 9101 ${CENTRAL_WS_ADDR} WS-01
    networks: [wm_network]
    restart: unless-stopped
    environment: [PYTHONUNBUFFERED=1, PYTHONIOENCODING=utf-8]

  wm_ws_e_01:
    image: wm_app:latest
    container_name: wm_ws_e_01
    command: python -u WM_WS_E.py ${KAFKA_BROKER} wm_ws_m_01:9101 --ws-id WS-01 --web-port 3001
    ports: ["3001:3001"]
    networks: [wm_network]
    depends_on: [wm_ws_m_01]
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment: [PYTHONUNBUFFERED=1, PYTHONIOENCODING=utf-8]

